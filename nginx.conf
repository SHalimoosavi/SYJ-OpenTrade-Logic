server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real gotcha with any client-side-routed SPA: without this, refreshing
    # the browser on e.g. /classify or /products returns a raw nginx 404,
    # because nginx looks for a literal file at that path. React Router
    # only knows how to handle these routes once index.html has loaded and
    # its JS has run -- so every unmatched path must fall back to it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets (Vite fingerprints them,
    # so a new deploy gets new filenames -- safe to cache aggressively).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
